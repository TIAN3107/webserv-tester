# ──────────────────────────────────────────────────────────────────────────────
# webserv — default.conf (Local ./www Structure)
# ──────────────────────────────────────────────────────────────────────────────

# ═══ Virtual Host 1 — Primary Website (port 8080) ════════════════════════════
server {
    listen       127.0.0.1:8080;
    server_name  localhost webserv.local;

    # Wurzelverzeichnis direkt im Projektordner
    root                 ./../../../www;
    client_max_body_size 10M;

    # Custom error pages (relativ zu root: ./www/errors/...)
    error_page 400      /errors/400.html;
    error_page 403      /errors/403.html;
    error_page 404      /errors/404.html;
    error_page 405      /errors/405.html;
    error_page 413      /errors/413.html;
    error_page 500 502  /errors/50x.html;

    # ── Default route ──────────────────────────────────────────────────────
    location / {
        allowed_methods GET;
        index           index.html;
        autoindex       off;
    }

    # ── Static assets with directory listing ───────────────────────────────
    # Sucht in ./www/files/
    location /files {
        allowed_methods GET;
        autoindex       on;
    }

    # ── File upload endpoint ───────────────────────────────────────────────
    location /uploads {
        allowed_methods     POST DELETE;
        root                ./www/uploads;
        client_max_body_size 50M;
    }

    # ── Python CGI scripts ─────────────────────────────────────────────────
    location /cgi-bin {
        allowed_methods GET POST;
        root            ./www/cgi-bin;
        cgi_pass        /usr/bin/python3;
        cgi_ext         .py;
    }

    # ── HTTP redirect (301 Moved Permanently) ──────────────────────────────
    location /old {
        return 301 /;
    }

    # ── Redirect to external URL ───────────────────────────────────────────
    location /github {
        return 302 https://github.com;
    }
}

# ═══ Virtual Host 2 — Secondary Website (port 8081) ══════════════════════════
server {
    listen       8081;
    server_name  secondary.local;

    # Separater Unterordner innerhalb von ./www
    root                 ./www/secondary;
    client_max_body_size 1M;

    error_page 404 /errors/404.html;

    location / {
        allowed_methods GET;
        index           index.html;
        autoindex       off;
    }
}

# ═══ Virtual Host 3 — Test Server (same port as VHost 1) ═════════════════════
server {
    listen       8080;
    server_name  test.local;

    # Separater Unterordner innerhalb von ./www
    root                 ./www/test;
    client_max_body_size 5M;

    location / {
        allowed_methods GET POST;
        index           index.html;
        autoindex       on;
    }
}